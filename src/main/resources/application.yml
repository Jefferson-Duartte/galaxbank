spring:
  application:
    name: galaxbank

  datasource:
    url: jdbc:postgresql://localhost:5432/galaxbank
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto:validate
    open-in-view: false
    properties:
      hibernate:
        formate-sql: true

  flyway:
    enable: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  private-key: ${jwt_private_key}
  public-key: 
  expiration-ms: 86400000